<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Selamat Tingal Ardian Sensei</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="smkn3yk.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0e16;
        --bg2: #080a10;
        --surface: #161a26;
        --surface2: #1f2433;
        --cyan: #f5c518;
        --purple: #b5622f;
        --gold: #ffe066;
        --green: #cbb789;
        --text: #f5efe4;
        --text-dim: #9c8f7c;
        --line: rgba(255, 224, 150, 0.08);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-top, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Inter", sans-serif;
        color: var(--text);
        position: relative;
        width: 100vw;
      }
      h1,
      h2,
      h3,
      .display {
        font-family: "Sora", sans-serif;
      }
      code, .code-font {
        font-family: "JetBrains Mono", monospace;
      }

      /* AMBIENT BG & MOON */
      #bg-ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #12151f, var(--bg));
      }

      #bg-ambient::before {
        content: "";
        position: absolute;
        top: -10%;
        left: -10%;
        width: 50vw;
        height: 50vw;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 197, 24, 0.15), transparent 70%);
        filter: blur(70px);
      }

      /* Glow kedua di kanan bawah biar komposisinya seimbang */
      #bg-ambient::after {
        content: "";
        position: absolute;
        bottom: -12%;
        right: -10%;
        width: 45vw;
        height: 45vw;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 197, 24, 0.12), transparent 70%);
        filter: blur(70px);
      }

      /* MOON CONTAINER */
      .moon-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform;
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }

      /* BULAN KUNING - GLOW SMOOTH */
      .cartoon-full-moon {
        position: absolute;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #fef3c7 50%, #fde68a 85%, #f59e0b 100%);
        box-shadow: 0 0 45px rgba(251, 191, 36, 0.75),
                    0 0 90px rgba(245, 158, 11, 0.45),
                    inset -10px -10px 20px rgba(217, 119, 6, 0.35);
        animation: moonFloat 7s ease-in-out infinite alternate;
        will-change: transform, box-shadow;
      }

      .cartoon-full-moon::before {
        content: "";
        position: absolute;
        top: 22%;
        left: 28%;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(217, 119, 6, 0.18);
        box-shadow: 24px 28px 0 -3px rgba(245, 158, 11, 0.22),
                    -10px 30px 0 -5px rgba(251, 191, 36, 0.2);
      }

      @keyframes moonFloat {
        0% {
          transform: translateY(0px) scale(1);
          box-shadow: 0 0 30px rgba(251, 191, 36, 0.65),
                      0 0 60px rgba(245, 158, 11, 0.4),
                      inset -8px -8px 16px rgba(217, 119, 6, 0.35);
        }
        50% {
          transform: translateY(-10px) scale(1.03);
          box-shadow: 0 0 45px rgba(251, 191, 36, 0.85),
                      0 0 85px rgba(245, 158, 11, 0.6),
                      inset -8px -8px 16px rgba(217, 119, 6, 0.35);
        }
        100% {
          transform: translateY(5px) scale(0.98);
          box-shadow: 0 0 35px rgba(251, 191, 36, 0.7),
                      0 0 70px rgba(245, 158, 11, 0.5),
                      inset -8px -8px 16px rgba(217, 119, 6, 0.35);
        }
      }

      #particles-canvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }

      /* PROGRESS BAR & NAVIGATION UI */
      #progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--line);
        z-index: 50;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--cyan), var(--purple), var(--green));
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 0 10px var(--cyan);
      }

      /* BGM FLOATING CONTROL BUTTON */
      #bgm-control {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 60;
        background: rgba(22, 26, 38, 0.8);
        border: 1px solid var(--cyan);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 0.85rem;
        cursor: pointer;
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "JetBrains Mono", monospace;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(245, 197, 24, 0.2);
      }
      #bgm-control:hover {
        border-color: var(--cyan);
        color: var(--cyan);
        box-shadow: 0 0 15px rgba(245, 197, 24, 0.4);
      }
      
      /* State saat BGM Mati */
      #bgm-control.muted {
        opacity: 0.5;
        border-color: rgba(255, 255, 255, 0.15);
        color: var(--text-dim);
        box-shadow: none;
      }
      #bgm-control.muted:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: var(--text);
      }
      /* State saat terkunci di slide akhir */
      #bgm-control:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
      }
      #bgm-control:disabled:hover {
        border-color: rgba(255, 255, 255, 0.15);
        color: var(--text-dim);
      }

      /* Belum boleh keliatan di slide pertama (cover) */
      #bgm-control.bgm-pending {
        opacity: 0;
        pointer-events: none;
      }
      /* Fade-in begitu masuk slide kedua — sekali muncul, tetap
         kepasang & keliatan terus di slide mana pun setelahnya. */
      #bgm-control.bgm-pop {
        animation: bgmFadeIn 0.7s ease;
      }
      @keyframes bgmFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Indikator loading kecil di pojok kanan atas */
      #loading-indicator {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top, 0px));
        left: 14px;
        z-index: 999;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        background: rgba(22, 26, 38, 0.75);
        border: 1px solid rgba(245, 197, 24, 0.25);
        border-radius: 999px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.65rem;
        color: var(--text-dim);
        backdrop-filter: blur(8px);
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #loading-indicator.hidden {
        opacity: 0;
      }
      .loading-spinner {
        width: 10px;
        height: 10px;
        border: 2px solid rgba(245, 197, 24, 0.25);
        border-top-color: var(--cyan);
        border-radius: 50%;
        animation: loading-spin 0.7s linear infinite;
      }
      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }

      /* Overlay blokir akses HP */
      #mobile-block {
        display: none;
      }
      #mobile-block.active {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 999999;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        background: radial-gradient(circle at 50% 30%, #161a26 0%, var(--bg) 70%);
      }
      html.is-mobile-blocked body {
        overflow: hidden;
      }
      .mobile-block-inner {
        max-width: 360px;
      }
      .mobile-block-inner h2 {
        font-family: "JetBrains Mono", monospace;
        color: var(--cyan);
        font-size: 1.2rem;
        margin-bottom: 12px;
        text-shadow: 0 0 15px rgba(245, 197, 24, 0.4);
      }
      .mobile-block-inner p {
        color: var(--text-dim);
        line-height: 1.6;
        font-size: 0.9rem;
      }

      /* Overlay wajib fullscreen sebelum lanjut — selalu di-mount, tinggal
         di-fade lewat opacity biar transisi ke/dari website utama halus,
         gak ngeblink kayak toggle display:none/flex. */
      #fullscreen-gate {
        position: fixed;
        inset: 0;
        z-index: 999998;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        background: radial-gradient(circle at 50% 30%, #161a26 0%, var(--bg) 70%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #fullscreen-gate.active {
        opacity: 1;
        pointer-events: auto;
      }
      html.is-fs-gated body {
        overflow: hidden;
      }
      .fullscreen-gate-inner {
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .fullscreen-gate-inner h2 {
        font-family: "JetBrains Mono", monospace;
        color: var(--cyan);
        font-size: 1.2rem;
        text-shadow: 0 0 15px rgba(245, 197, 24, 0.4);
      }
      .fullscreen-gate-inner p {
        color: var(--text-dim);
        line-height: 1.6;
        font-size: 0.9rem;
      }

      .nav-arrow {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        z-index: 50;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 1px solid rgba(245, 197, 24, 0.2);
        background: rgba(22, 26, 38, 0.6);
        color: var(--text);
        font-size: 1.6rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(10px);
        transition: 0.25s;
      }
      .nav-arrow:hover {
        background: rgba(245, 197, 24, 0.2);
        border-color: var(--cyan);
        color: var(--cyan);
        box-shadow: 0 0 20px rgba(245, 197, 24, 0.4);
      }
      .nav-arrow.left { left: 18px; }
      .nav-arrow.right { right: 18px; }
      .nav-arrow:disabled {
        opacity: 0.2;
        cursor: default;
        box-shadow: none;
      }
      @media (max-width: 640px) {
        .nav-arrow {
          width: 40px;
          height: 40px;
          font-size: 1.3rem;
        }
        .cartoon-full-moon {
          width: 95px;
          height: 95px;
        }
      }

      /* ================= OVERHAUL 3D CAROUSEL & SLIDES ================= */
      #carousel {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        perspective: 1200px;
        perspective-origin: 50% 50%;
      }

      .slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 8vw;
        overflow-y: auto;
        opacity: 0;
        pointer-events: none;
        will-change: transform, opacity, filter;
        transform-style: preserve-3d;
        
        transition: 
          transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), 
          opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
          filter 0.7s ease;
      }

      .slide.active {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotateY(0deg) scale(1);
        filter: blur(0px);
        pointer-events: auto;
      }

      .slide.next {
        opacity: 0;
        transform: translate3d(65vw, 0, -250px) rotateY(-22deg) scale(0.82);
        filter: blur(8px);
      }

      .slide.prev {
        opacity: 0;
        transform: translate3d(-65vw, 0, -250px) rotateY(22deg) scale(0.82);
        filter: blur(8px);
      }

      .student-card, .hero-inner, .finale-inner {
        transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
        will-change: transform, opacity;
      }

      .slide.next .student-card,
      .slide.next .hero-inner,
      .slide.next .finale-inner {
        transform: scale(0.9) translateY(20px);
        opacity: 0;
      }

      .slide.prev .student-card,
      .slide.prev .hero-inner,
      .slide.prev .finale-inner {
        transform: scale(0.9) translateY(-20px);
        opacity: 0;
      }

      .slide.active .student-card,
      .slide.active .hero-inner,
      .slide.active .finale-inner {
        transform: scale(1) translateY(0);
        opacity: 1;
      }

      .student-card > * {
        opacity: 0;
        transform: translateY(18px);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .slide.active .student-card > :nth-child(1) { transition-delay: 0.15s; opacity: 1; transform: translateY(0); }
      .slide.active .student-card > :nth-child(2) { transition-delay: 0.25s; opacity: 1; transform: translateY(0); }

      /* HERO SLIDE */
      .hero-inner {
        max-width: 840px;
        text-align: center;
      }
      .hero-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(245, 197, 24, 0.1);
        border: 1px solid rgba(245, 197, 24, 0.3);
        color: var(--cyan);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        padding: 6px 18px;
        border-radius: 999px;
        margin-bottom: 22px;
      }
      .hero-inner h1 {
        font-size: clamp(2.3rem, 5.5vw, 4rem);
        font-weight: 800;
        line-height: 1.15;
        background: linear-gradient(110deg, #ffffff, var(--cyan) 40%, var(--purple) 80%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 20px;
      }
      .hero-sub {
        font-size: clamp(1rem, 2vw, 1.2rem);
        color: var(--text-dim);
        line-height: 1.7;
        margin-bottom: 34px;
      }
      .hero-sub highlight {
        color: var(--cyan);
        font-weight: 600;
      }
      .hero-cta {
        font-family: "Sora", sans-serif;
        font-weight: 600;
        font-size: 1rem;
        color: #0b0e16;
        background: linear-gradient(100deg, var(--cyan), var(--green));
        border: none;
        border-radius: 999px;
        padding: 16px 40px;
        cursor: pointer;
        box-shadow: 0 0 25px rgba(245, 197, 24, 0.4);
        transition: 0.3s;
      }
      .hero-cta:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 0 35px rgba(245, 197, 24, 0.7);
      }

      /* STUDENT CARD SLIDES */
      .student-card {
        width: 100%;
        max-width: 920px;
        display: grid;
        grid-template-columns: 290px 1fr;
        gap: 40px;
        background: rgba(22, 26, 38, 0.7);
        border: 1px solid rgba(245, 197, 24, 0.2);
        border-radius: 24px;
        padding: 40px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }
      @media (max-width: 760px) {
        .student-card {
          grid-template-columns: 1fr;
          padding: 24px;
          gap: 22px;
        }
      }
      .absen-badge {
        display: inline-block;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 0.8rem;
        color: #0b0e16;
        background: linear-gradient(100deg, var(--cyan), var(--purple));
        padding: 5px 14px;
        border-radius: 999px;
        margin-bottom: 12px;
      }
      .media-box {
        width: 100%;
        aspect-ratio: 1/1;
        border-radius: 18px;
        overflow: hidden;
        background: var(--bg2);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .media-box img, .media-box video, .media-box iframe {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: none;
      }
      .student-name {
        font-size: clamp(1.4rem, 2.8vw, 2rem);
        font-weight: 700;
      }
      .student-nick {
        color: var(--cyan);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.95rem;
        margin-bottom: 18px;
      }
      .kp-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        color: var(--gold);
        margin: 16px 0 6px;
      }
      .kp-text {
        color: var(--text-dim);
        line-height: 1.65;
        font-size: 0.95rem;
      }

      /* FINALE SLIDE */
      .finale-inner {
        max-width: 920px;
        text-align: center;
        width: 100%;
      }
      .finale-inner h2 {
        font-size: clamp(2rem, 4.5vw, 3.2rem);
        font-weight: 800;
        margin-bottom: 12px;
        background: linear-gradient(100deg, #ffffff, var(--cyan) 50%, var(--purple));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .finale-inner p {
        color: var(--text-dim);
        margin-bottom: 24px;
        font-size: 1rem;
      }
      
      .video-shell {
        width: 100%;
        aspect-ratio: 16/9;
        border-radius: 20px;
        overflow: hidden;
        background: #000;
        border: 2px solid rgba(245, 197, 24, 0.4);
        box-shadow: 0 0 30px rgba(245, 197, 24, 0.2), var(--shadow);
        position: relative;
        margin: 0 auto;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .video-shell:hover {
        border-color: var(--cyan);
        box-shadow: 0 0 40px rgba(245, 197, 24, 0.4), var(--shadow);
      }

      .video-shell video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .video-shell.user-idle {
        cursor: none;
      }

      .video-shell.bounce-anim {
        animation: videoBounce 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes videoBounce {
        0% { transform: scale(0.94); filter: brightness(0.8); }
        50% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 60px rgba(245, 197, 24, 0.7); }
        100% { transform: scale(1); filter: brightness(1); }
      }

      .video-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: rgba(11, 14, 22, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .video-overlay.hidden {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      .play-icon {
        width: 80px;
        height: 80px;
        background: rgba(245, 197, 24, 0.15);
        border: 2px solid var(--cyan);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 2.2rem;
        padding-left: 6px;
        position: relative;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .play-icon::before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px solid var(--purple);
        opacity: 0;
        transform: scale(0.8);
        transition: all 0.3s ease;
      }
      .video-overlay:hover .play-icon {
        transform: scale(1.15);
        background: var(--cyan);
        color: #0b0e16;
        border-color: var(--cyan);
        box-shadow: 0 0 35px rgba(245, 197, 24, 0.8);
      }
      .video-overlay:hover .play-icon::before {
        opacity: 0.8;
        transform: scale(1.5);
        animation: pulseRing 1.5s infinite;
      }
      @keyframes pulseRing {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      .play-icon.clicked {
        animation: playPress 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes playPress {
        0% { transform: scale(1.15); }
        30% { transform: scale(0.85); background: var(--gold); }
        60% { box-shadow: 0 0 50px 20px rgba(245, 197, 24, 0.8); }
        100% { transform: scale(1.4); opacity: 0; }
      }

      .custom-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        background: linear-gradient(to top, rgba(11, 14, 22, 0.95), transparent);
        padding: 24px 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }

      #cinema-close {
        position: absolute;
        top: 20px;
        right: 24px;
        z-index: 30;
        background: rgba(8, 10, 16, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;

    <script>
      // Deteksi dini — dijalankan sebelum konten berat lain dimuat,
      // biar nggak ada "kedipan" konten sebelum overlay muncul.
      (function () {
        function isMobileDevice() {
          var uaMobile = /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|webOS/i.test(
            navigator.userAgent
          );
          var narrowTouch =
            ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
            window.innerWidth <= 768;
          return uaMobile || narrowTouch;
        }
        if (isMobileDevice()) {
          document.documentElement.classList.add("is-mobile-blocked");
          document.getElementById("mobile-block").classList.add("active");
        } else {
          var bgm = document.getElementById("bgmAudio");
          if (bgm) bgm.preload = "auto";
        }
      })();

      // Wajib fullscreen — kalau pas pertama masuk kedetect belum
      // fullscreen, tampilin overlay minta klik buat masuk fullscreen dulu.
      // Kalau di tengah jalan keluar fullscreen lagi, overlay ini muncul lagi.
      (function setupFullscreenGate() {
        var gate = document.getElementById("fullscreen-gate");
        var btn = document.getElementById("fsGateBtn");
        if (!gate || !btn) return;

        function isFullscreen() {
          return !!(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement
          );
        }

        function requestFS() {
          var el = document.documentElement;
          var req =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.mozRequestFullScreen ||
            el.msRequestFullscreen;
          if (req) {
            try {
              var result = req.call(el);
              if (result && result.catch) result.catch(function () {});
            } catch (e) {}
          }
        }

        function checkState() {
          // Kalau lagi diblokir karena HP, biar overlay HP aja yang tampil.
          if (document.documentElement.classList.contains("is-mobile-blocked")) {
            gate.classList.remove("active");
            document.documentElement.classList.remove("is-fs-gated");
            return;
          }
          if (isFullscreen()) {
            gate.classList.remove("active");
            document.documentElement.classList.remove("is-fs-gated");
          } else {
            gate.classList.add("active");
            document.documentElement.classList.add("is-fs-gated");
          }
        }

        btn.addEventListener("click", requestFS);

        [
          "fullscreenchange",
          "webkitfullscreenchange",
          "mozfullscreenchange",
          "MSFullscreenChange",
        ].forEach(function (evt) {
          document.addEventListener(evt, checkState);
        });

        checkState();
      })();
    </script>

    <script>
      /* ================= BGM LOKAL (AUDIO ELEMENT) ================= */
      const bgmAudio = document.getElementById("bgmAudio");
      let bgmVolume = 0.5; // 0 sampai 1
      let fadeInterval = null;
      let isFading = false;
      let isBgmOn = false;
      let hasInteracted = false;
      let bgmAutoPausedByFinale = false;
      let bgmBtnRevealed = false;

      bgmAudio.volume = 0;

      function updateBgmUI() {
        const bgmIcon = document.getElementById("bgm-icon");
        const bgmBtn = document.getElementById("bgm-control");

        if (isBgmOn) {
          bgmIcon.textContent = "🎵";
          bgmBtn.classList.remove("muted");
        } else {
          bgmIcon.textContent = "🔇";
          bgmBtn.classList.add("muted");
        }
      }

      const bgmBtn = document.getElementById("bgm-control");

      // Fungsi Fade Out (Transisi mati 0.3 detik)
      function fadeOutBGM(callback) {
        clearInterval(fadeInterval);
        isFading = true;

        let currentVol = bgmAudio.volume;
        const duration = 1800; // 1.8 detik
        const stepTime = 30;   // Update tiap 30ms
        const steps = duration / stepTime;
        const volStep = currentVol / steps;

        fadeInterval = setInterval(() => {
          currentVol -= volStep;
          if (currentVol <= 0) {
            clearInterval(fadeInterval);
            bgmAudio.volume = 0;
            bgmAudio.pause();
            isFading = false;
            if (callback) callback();
          } else {
            bgmAudio.volume = currentVol;
          }
        }, stepTime);
      }

      // Fungsi Fade In (Transisi hidup 0.3 detik)
      function fadeInBGM(targetVol = bgmVolume) {
        clearInterval(fadeInterval);
        isFading = true;

        if (bgmAudio.paused) {
          bgmAudio.volume = 0;
          const playPromise = bgmAudio.play();
          if (playPromise && playPromise.catch) {
            playPromise.catch(() => {
              console.log("Autoplay diblokir oleh browser, menunggu interaksi pengguna.");
              isFading = false;
            });
          }
        }

        let currentVol = bgmAudio.volume;
        const duration = 1800; // 1.8 detik
        const stepTime = 30;
        const steps = duration / stepTime;
        const volStep = (targetVol - currentVol) / steps;

        if (volStep <= 0) {
          isFading = false;
          return;
        }

        fadeInterval = setInterval(() => {
          currentVol += volStep;
          if (currentVol >= targetVol) {
            clearInterval(fadeInterval);
            bgmAudio.volume = targetVol;
            isFading = false;
          } else {
            bgmAudio.volume = currentVol;
          }
        }, stepTime);
      }

      // Tombol manual On/Off BGM
      function toggleBGM() {
        // Di slide paling akhir, tombolnya dikunci — musik cuma bisa
        // dinyalain lagi dengan balik ke slide sebelumnya.
        if (typeof current !== "undefined" && typeof total !== "undefined" && current === total - 1) {
          return;
        }
        bgmAutoPausedByFinale = false; // klik manual selalu menang atas state auto
        isBgmOn = !isBgmOn;
        updateBgmUI();

        if (isBgmOn) {
          fadeInBGM(bgmVolume);
        } else {
          fadeOutBGM();
        }
      }

      bgmBtn.addEventListener("click", toggleBGM);

      // Musik cuma boleh mulai begitu tombol "Kesan Pesan dari Kami" (startBtn)
      // diklik — bukan klik sembarangan di halaman. Pakai event delegation
      // (bukan getElementById langsung) karena tombolnya baru dibuat belakangan
      // lewat carousel.innerHTML, jadi belum ada di DOM saat skrip ini jalan.
      function startAudioOnUserInteraction(e) {
        if (hasInteracted) return;
        if (!e || !e.target || !e.target.closest || !e.target.closest("#startBtn")) {
          return;
        }
        hasInteracted = true;

        if (!isBgmOn) {
          isBgmOn = true;
          updateBgmUI();
          fadeInBGM(bgmVolume);
        }
      }

      document.addEventListener("click", startAudioOnUserInteraction);

      /* ================= CANVAS PARTICLES ================= */
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.6;
          this.speedY = -(Math.random() * 0.4 + 0.15);
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX;
          if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
            this.reset();
            this.y = canvas.height;
          }
        }
        draw() {
          ctx.fillStyle = `rgba(245, 197, 24, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < 65; i++) {
        particles.push(new Particle());
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      function ytId(url) {
        if (!url) return null;
        const m = url.match(/(?:youtu\.be\/|v=|embed\/|watch\?v=)([^#&?]{11})/);
        return m ? m[1] : null;
      }

      function mediaEmbed(video, photo) {
        if (video) {
          const id = ytId(video);
          if (id) return `<div class="media-box"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe></div>`;
          return `<div class="media-box"><video src="${video}" controls playsinline></video></div>`;
        }
        if (photo) return `<div class="media-box"><img src="${photo}" loading="lazy" alt=""></div>`;
        return `<div class="media-box"><span class="code-font" style="color:var(--cyan);font-size:2.2rem;">&lt;11_TKJ/&gt;</span></div>`;

      const carousel = document.getElementById("carousel");
      let html = "";

      // Slide 1: Hero
      html += `

      // Slide 38: Finale
      html += `

      carousel.innerHTML = html;

      /* ================= CAROUSEL NAVIGATION & MOON LOGIC ================= */
      const slides = Array.from(document.querySelectorAll(".slide"));
      const total = slides.length;
      let current = 0;
      const progressFill = document.getElementById("progress-fill");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const moonContainer = document.getElementById("moonContainer");

      function updateMoonPosition(index) {
        const progress = index / (total - 1); 

        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        const startX = windowWidth * 0.05; 
        const endX = windowWidth * 0.88; 
        const posX = startX + (endX - startX) * progress;

        const baseHeight = windowHeight * 0.42; 
        const peakHeight = windowHeight * 0.30; 
        const posY = baseHeight - Math.sin(progress * Math.PI) * peakHeight;

        moonContainer.style.transform = `translate3d(${posX}px, ${posY}px, 0px)`;
      }

      function render() {
        slides.forEach((sl, i) => {
          sl.classList.remove("active", "prev", "next");
          if (i === current) {
            sl.classList.add("active");
          } else if (i < current) {
            sl.classList.add("prev");
          } else {
            sl.classList.add("next");
          }
        });
        
        progressFill.style.width = (current / (total - 1)) * 100 + "%";
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === total - 1;

        // Slide paling awal (cover) cuma bisa dilewati lewat tombol
        // "Jelajahi Ucapan" — panah kanan/kiri disembunyikan total di sini.
        // Mulai slide absen 1 (index 1) panah muncul & aktif seperti biasa.
        if (current === 0) {
          prevBtn.style.display = "none";
          nextBtn.style.display = "none";
        } else {
          prevBtn.style.display = "";
          nextBtn.style.display = "";
        }

        updateMoonPosition(current);

        // Tombol BGM baru nongol pas pertama kali masuk slide ke-2 (index 1),
        // dengan animasi pop-in. Sesudahnya, tetap keliatan permanen walau
        // balik lagi ke slide 1 atau pindah ke slide mana pun.
        if (!bgmBtnRevealed && current >= 1) {
          bgmBtnRevealed = true;
          bgmBtn.classList.remove("bgm-pending");
          bgmBtn.classList.add("bgm-pop");
          bgmBtn.addEventListener(
            "animationend",
            () => bgmBtn.classList.remove("bgm-pop"),
            { once: true }
          );
        }

        // Auto fadeout BGM saat memasuki halaman terakhir (bukan mati total,
        // cuma di-pause). Kalau balik lagi ke slide sebelumnya, musiknya
        // fade in lanjut lagi otomatis — kecuali user sempat matiin manual.
        if (current === total - 1) {
          if (isBgmOn) {
            isBgmOn = false;
            updateBgmUI();
            fadeOutBGM();
            bgmAutoPausedByFinale = true;
          }
          bgmBtn.disabled = true;
        } else {
          bgmBtn.disabled = false;
          if (bgmAutoPausedByFinale) {
            bgmAutoPausedByFinale = false;
            isBgmOn = true;
            updateBgmUI();
            fadeInBGM(bgmVolume);
          }
        }
      }

      function goTo(i) {
        current = Math.max(0, Math.min(total - 1, i));
        render();
      }

      prevBtn.addEventListener("click", () => goTo(current - 1));
      nextBtn.addEventListener("click", () => goTo(current + 1));
      document.getElementById("startBtn").addEventListener("click", () => goTo(1));

      window.addEventListener("resize", () => {
        updateMoonPosition(current);
      });

      /* ================= SWIPE NAVIGASI (HP) ================= */
      (function setupSwipe() {
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        const SWIPE_MIN_DISTANCE = 50; // px
        const SWIPE_MAX_OFF_AXIS = 60; // px, biar swipe vertikal (scroll) gak kepencet
        const SWIPE_MAX_TIME = 600; // ms

        carousel.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
        }, { passive: true });

        carousel.addEventListener("touchend", (e) => {
          // Slide cover terkunci — samain sama aturan panah & keyboard,
          // harus pencet tombol "Jelajahi Ucapan" secara fisik.
          if (current === 0) return;
          // Jangan swipe kalau lagi mulai dari dalam player/kontrol video
          // finale (biar gak nabrak drag progress bar / tombol video).
          if (e.target.closest && e.target.closest(".video-shell")) return;

          const touch = e.changedTouches[0];
          if (!touch) return;
          const dx = touch.clientX - touchStartX;
          const dy = touch.clientY - touchStartY;
          const dt = Date.now() - touchStartTime;

          if (dt > SWIPE_MAX_TIME) return;
          if (Math.abs(dy) > SWIPE_MAX_OFF_AXIS) return;
          if (Math.abs(dx) < SWIPE_MIN_DISTANCE) return;

          if (dx < 0) {
            goTo(current + 1); // swipe ke kiri -> slide berikutnya
          } else {
            goTo(current - 1); // swipe ke kanan -> slide sebelumnya
          }
        }, { passive: true });
      })();

      /* ================= CUSTOM VIDEO PLAYER ================= */
      const videoContainer = document.getElementById("videoContainer");
      const mainVideo = document.getElementById("mainVideo");
      const videoOverlay = document.getElementById("videoOverlay");
      const playIcon = document.getElementById("playIcon");
      const cinemaClose = document.getElementById("cinema-close");

      const playPauseBtn = document.getElementById("playPauseBtn");
      const muteBtn = document.getElementById("muteBtn");
      const fsBtn = document.getElementById("fsBtn");
      const progressContainer = document.getElementById("progressContainer");
      const progressFilled = document.getElementById("progressFilled");
      const timeDisplay = document.getElementById("timeDisplay");

      let hideTimer = null;

      function triggerBounce() {
        videoContainer.classList.remove("bounce-anim");
        void videoContainer.offsetWidth;
        videoContainer.classList.add("bounce-anim");
      }

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function togglePlay() {
        if (mainVideo.paused) {
          mainVideo.play();
          playPauseBtn.textContent = "⏸";
          videoContainer.classList.add("playing");
          videoOverlay.classList.add("hidden");
          resetHideTimer();
        } else {
          mainVideo.pause();
          playPauseBtn.textContent = "▶";
          videoContainer.classList.remove("playing");
          showUI();
        }
      }

      function toggleFullscreen() {
        // Cek spesifik elemen videoContainer-nya, bukan cuma "ada fullscreen
        // apa nggak" — soalnya halaman ini sendiri bisa udah fullscreen
        // duluan (dari gerbang wajib-fullscreen). Kalau cuma cek truthy,
        // klik video malah nge-exit fullscreen halaman alih-alih masuk
        // fullscreen video, terus mental balik ke gerbang wajib-fullscreen.
        const isVideoFullscreen =
          document.fullscreenElement === videoContainer ||
          document.webkitFullscreenElement === videoContainer;

        if (!isVideoFullscreen) {
          if (videoContainer.requestFullscreen) {
            videoContainer.requestFullscreen();
          } else if (videoContainer.webkitRequestFullscreen) {
            videoContainer.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      }

      function showUI() {
        videoContainer.classList.add("controls-visible");
        videoContainer.classList.remove("user-idle");
      }

      function hideUI() {
        if (!mainVideo.paused) {
          videoContainer.classList.remove("controls-visible");
          videoContainer.classList.add("user-idle");
        }
      }

      function resetHideTimer() {
        showUI();
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          hideUI();
        }, 2500);
      }

      videoContainer.addEventListener("mousemove", resetHideTimer);
      videoContainer.addEventListener("mouseleave", () => {
        if (!mainVideo.paused) hideUI();
      });

      videoOverlay.addEventListener("click", () => {
        playIcon.classList.remove("clicked");
        void playIcon.offsetWidth;
        playIcon.classList.add("clicked");
        
        triggerBounce();

        setTimeout(() => {
          toggleFullscreen();
          togglePlay();
        }, 280);
      });

      playPauseBtn.addEventListener("click", togglePlay);
      mainVideo.addEventListener("click", togglePlay);

      muteBtn.addEventListener("click", () => {
        mainVideo.muted = !mainVideo.muted;
        muteBtn.textContent = mainVideo.muted ? "🔇" : "🔊";
      });

      fsBtn.addEventListener("click", toggleFullscreen);

      cinemaClose.addEventListener("click", () => {
        triggerBounce();
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          mainVideo.pause();
          videoContainer.classList.remove("playing");
          videoOverlay.classList.remove("hidden");
          showUI();
        }
      });

      mainVideo.addEventListener("timeupdate", () => {
        if (mainVideo.duration) {
          const pct = (mainVideo.currentTime / mainVideo.duration) * 100;
          progressFilled.style.width = pct + "%";
          timeDisplay.textContent = `${formatTime(mainVideo.currentTime)} / ${formatTime(mainVideo.duration)}`;
        }
      });

      progressContainer.addEventListener("click", (e) => {
        const rect = progressContainer.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        mainVideo.currentTime = pos * mainVideo.duration;
      });

      document.addEventListener("fullscreenchange", () => {
        triggerBounce();
        resetHideTimer();
      });

      /* ================= KEYBOARD CONTROLS ================= */
      window.addEventListener("keydown", (e) => {
        const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
        if (tag === "input" || tag === "textarea") return;

        // Di slide cover (index 0), panah keyboard dimatikan juga —
        // harus klik fisik tombol "Jelajahi Ucapan" buat lanjut.
        if (current === 0 && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
          return;
        }

        if (e.key === "ArrowRight") {
          goTo(current + 1);
        } else if (e.key === "ArrowLeft") {
          goTo(current - 1);
        } 
        else if (current === total - 1) {
          if (e.code === "Space") {
            e.preventDefault();
            togglePlay();
          } else if (e.key === "f" || e.key === "F") {
            e.preventDefault();
            toggleFullscreen();
          }
        }
      });

      render();

      /* ================= SEMBUNYIIN LOADING INDICATOR ================= */
      (function hideLoadingIndicator() {
        const loader = document.getElementById("loading-indicator");
        if (!loader) return;
        let hidden = false;
        function doHide() {
          if (hidden) return;
          hidden = true;
          loader.classList.add("hidden");
          setTimeout(() => loader.remove(), 500);
        }
        // Begitu semua aset halaman (gambar, dll) selesai dimuat browser.
        window.addEventListener("load", doHide);
        // Jaga-jaga kalau ada aset (misal video besar) yang bikin event
        // "load" nggak kunjung nembak — paksa hilang maksimal 5 detik.
        setTimeout(doHide, 5000);
      })();
    </script>
